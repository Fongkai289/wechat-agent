[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-agent"
version = "0.1.0"
description = "A local, citation-backed knowledge assistant for searching and tracking information across WeChat conversations."
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = [
  "pycryptodome>=3.20",
  "zstandard>=0.23",
  "langgraph>=0.6.11,<0.7",
  "langgraph-checkpoint-sqlite==2.0.11",
  "jsonschema>=4.23,<5",
  "numpy>=1.24",
]

[project.optional-dependencies]
voice = [
  "openai-whisper>=20231117",
  "pilk>=0.2",
]

[project.scripts]
wechat-agent = "wechat_agent.cli:main"

[tool.setuptools.packages.find]
include = ["wechat_agent*"]

[tool.ruff]
target-version = "py39"
line-length = 120
extend-exclude = ["work", "data", "artifacts", "exports", "decrypted", "web_cache"]

[tool.ruff.lint]
# Correctness checks only: undefined names, unused imports/variables,
# redefinitions and similar pyflakes findings.
select = ["F"]
